<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap">
<title>Kitten Studio</title>
<style>
:root{--bg:#ffe9ef;--bg2:#e9e2ff;--fg:#4a2c3f;--card:rgba(255,255,255,.62);--line:rgba(255,255,255,.75);--acc:#ff6fa5;--cat:#f1e4d0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1233;--bg2:#2b1a45;--fg:#fbeaff;--card:rgba(40,28,64,.6);--line:rgba(255,255,255,.16)}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(var(--bg),var(--bg2));color:var(--fg);font:16px/1.4 "Fredoka",ui-rounded,"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
h1{text-align:center;margin:18px 12px 4px;font-size:clamp(28px,6vw,46px);font-weight:700;letter-spacing:.5px;background:linear-gradient(90deg,#ff6fa5,#ffa86f,#b388ff,#6fc3ff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hue 8s linear infinite alternate}
@keyframes hue{to{background-position:100% 0}}
.sub{text-align:center;margin:0 12px 12px;opacity:.7;font-size:14px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 12px;justify-content:safe center}
.tab{flex:none;border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:8px 14px;font:600 15px system-ui;cursor:pointer}
.tab[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center;padding:8px 20px;font-size:14px;background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:2px solid var(--line);border-radius:999px;width:fit-content;max-width:calc(100% - 24px);margin:6px auto}
.bar label{display:flex;align-items:center;gap:6px}
select,input[type=range]{accent-color:var(--acc)}
select{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:4px 6px}
.stage{position:relative;max-width:900px;width:calc(100% - 24px);margin:10px auto 0;padding-top:240px;padding-bottom:20px;min-height:520px;background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:2px solid var(--line);border-radius:36px;box-shadow:0 20px 60px rgba(150,70,160,.2),inset 0 1px 0 rgba(255,255,255,.6)}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.opts{display:flex;gap:8px;justify-content:center;margin:0 0 12px;flex-wrap:wrap;position:relative;z-index:1}
.opt{border:2px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:6px 12px;font:600 14px system-ui;cursor:pointer}
.opt[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
.inst{display:flex;gap:12px;justify-content:center;align-items:flex-end;flex-wrap:wrap;min-height:200px;padding:0 8px 8px;position:relative}
.key{border:0;cursor:pointer;color:#fff;font:700 14px system-ui;background:var(--c);width:96px;height:96px;border-radius:16px;box-shadow:0 6px 0 rgba(0,0,0,.3);transition:transform .06s;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;padding:8px;min-width:0;touch-action:none;-webkit-tap-highlight-color:transparent;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.key.on{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.3);filter:brightness(1.25)}
kbd{background:rgba(0,0,0,.32);border-radius:6px;padding:1px 7px;font:600 12px ui-monospace,monospace}
.nohints kbd{display:none}
.bongos .key,.drums .key,.trumpet .key{border-radius:50%}
.piano{flex-wrap:nowrap;gap:0;max-width:760px;margin:0 auto;height:230px;align-items:stretch}
.piano .key.w{flex:1;width:auto;height:auto;background:#fff;color:#333;text-shadow:none;border:1px solid #aaa;border-radius:0 0 8px 8px;box-shadow:inset 0 -8px 0 #ddd}
.piano .key.w.on{filter:brightness(.8);transform:none}
.piano .key.b{position:absolute;top:8px;height:60%;width:6%;background:#222;z-index:2;border-radius:0 0 6px 6px;padding:4px 0;box-shadow:none}
.piano .key.b.on{background:#666;transform:none}
.piano kbd{background:#0002;color:inherit}
.xylo .key{width:clamp(36px,9vw,70px)}
.guitar{flex-direction:column;align-items:stretch;max-width:560px;margin:0 auto;gap:8px}
.guitar .key{width:auto;height:40px;flex-direction:row;justify-content:space-between;align-items:center;border-radius:10px}
.guitar .key.on{transform:scaleY(.8)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-2}
.floaties{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:-1}
.floaties span{position:absolute;bottom:-50px;font-size:26px;opacity:.55;animation:rise 16s linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(30deg)}}
@media (prefers-reduced-motion:reduce){.floaties{display:none}h1{animation:none}}
.tab,.opt,.key,select{font-family:inherit}
.tab{backdrop-filter:blur(8px);transition:transform .15s,background .2s;box-shadow:0 3px 0 rgba(150,70,160,.15)}
.tab:hover{transform:translateY(-3px) rotate(-1.5deg)}
.tab[aria-selected=true]{background:linear-gradient(135deg,#ff6fa5,#ffa86f);box-shadow:0 4px 14px rgba(255,111,165,.5)}
.opt{transition:transform .15s}.opt:hover{transform:translateY(-2px)}
.opt[aria-pressed=true]{background:linear-gradient(135deg,#ff6fa5,#ffa86f)}
.key{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 68%,#fff),var(--c));box-shadow:0 6px 0 rgba(0,0,0,.22),0 10px 18px rgba(80,30,90,.18),inset 0 2px 0 rgba(255,255,255,.5);transition:transform .08s,filter .15s}
.key:not(.on):hover{filter:brightness(1.08) saturate(1.1);transform:translateY(-3px)}
:root{--cat-d:color-mix(in srgb,var(--cat) 58%,#1a0f14);--cat-l:color-mix(in srgb,var(--cat) 62%,#fff)}
.s0{stop-color:var(--cat-l)}.s1{stop-color:var(--cat)}.s2{stop-color:var(--cat-d)}
.fur{fill:url(#fur);stroke:var(--cat-d);stroke-width:1.6;stroke-linejoin:round}
.st{fill:none;stroke:var(--cat-d);stroke-linecap:round;opacity:.5}
.lt{fill:var(--cat-l);opacity:.8}
.wh{fill:none;stroke:#fff;stroke-width:1.5;stroke-linecap:round;filter:drop-shadow(0 0 1px rgba(60,30,60,.55))}
.t1,.t2,.t3{fill:none;stroke-linecap:round}.t1{stroke:var(--cat-d);stroke-width:26}.t2{stroke:var(--cat);stroke-width:21}.t3{stroke:var(--cat-d);stroke-width:21;stroke-dasharray:4 10;opacity:.4}
#ov.photo #arms{display:none}#ov.photo #cc>*:not(#ph){display:none}
#ov.happy.photo #cc{animation:wig .3s ease-in-out infinite}@keyframes wig{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
#ov.sleep.photo #ph{opacity:.75}
#ov.kit #arms{display:block}
.lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(.2);opacity:0;transition:transform .07s,opacity .07s}
#ov.blink .lid,#ov.sleep .lid{transform:scaleY(1);opacity:1}#ov.happy .lid{transform:scaleY(.55);opacity:1}
#cat{pointer-events:auto;cursor:pointer}#ov{color:var(--fg)}
.eye{transform-box:fill-box;transform-origin:center;transition:transform .08s}
#ov.blink .eye,#ov.sleep .eye{transform:scaleY(.1)}#ov.happy .eye{transform:scaleY(.55)}
.ear{transform-box:fill-box;transform-origin:50% 100%;transition:transform .12s}
#ov.twitch .ear.l{transform:rotate(-14deg)}#ov.twitch .ear.r{transform:rotate(10deg)}
.tail{transform-box:fill-box;transform-origin:0% 100%;animation:wag 2.6s ease-in-out infinite}
#ov.happy .tail{animation-duration:.4s}
@keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
#cc{transform-origin:0 270px;animation:br 3.2s ease-in-out infinite}
@keyframes br{50%{transform:scale(1.012,1.02)}}
@media (prefers-reduced-motion:reduce){.tail,#cc{animation:none}}
.hint{text-align:center;font-size:14px;opacity:.75;margin:10px 16px 28px}

 S=Math.max(.55,Math.min(CS[I[cur].cls]||1,W/460,(avail-need)/290));

/* ---------- shader background (caustics + soft gradient mesh + grain) ---------- */
let pulse=0;
(function(){
 const cv=document.createElement('canvas');cv.id='bg';document.body.prepend(cv);
 const gl=cv.getContext('webgl',{antialias:false,alpha:false});if(!gl){cv.remove();return}
 const vs='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
 const fs=`precision highp float;uniform vec2 r,m;uniform float t,d,p;
float caus(vec2 uv,float tm){vec2 q=mod(uv*6.28318,6.28318)-250.;vec2 i=q;float c=1.,k=.005;
 for(int n=0;n<5;n++){float tt=tm*(1.-(3.5/float(n+1)));i=q+vec2(cos(tt-i.x)+sin(tt+i.y),sin(tt-i.y)+cos(tt+i.x));c+=1./length(vec2(q.x/(sin(i.x+tt)/k),q.y/(cos(i.y+tt)/k)));}
 c/=5.;c=1.17-pow(c,1.4);return pow(abs(c),8.);}
void main(){
 vec2 uv=gl_FragCoord.xy/r;vec2 q=uv*vec2(r.x/r.y,1.);
 vec3 a=d>.5?vec3(.09,.06,.19):vec3(1.,.91,.93);
 vec3 b=d>.5?vec3(.27,.12,.40):vec3(.99,.80,.90);
 vec3 c=d>.5?vec3(.07,.16,.34):vec3(.82,.88,1.);
 float n1=.5+.5*sin(q.x*2.+t*.2+sin(q.y*3.+t*.3));
 float n2=.5+.5*sin(q.y*2.5-t*.25+cos(q.x*2.+t*.2));
 vec3 col=mix(mix(a,b,n1),c,n2*.65);
 float g=exp(-distance(uv,m)*3.2);
 col+=(d>.5?vec3(.28,.13,.34):vec3(1.,.88,.95))*g*.3;
 float cs=caus(q*.55,t*.35+23.);
 col+=cs*(d>.5?vec3(.30,.26,.60):vec3(.85,.93,1.))*.4;
 col+=p*vec3(1.,.55,.8)*.14*(1.-uv.y*.8);
 col*=1.-.55*dot(uv-.5,uv-.5);
 col+=(fract(sin(dot(gl_FragCoord.xy+t,vec2(12.9898,78.233)))*43758.5453)-.5)*.035;
 gl_FragColor=vec4(col,1.);}`;
 const sh=(ty,s)=>{const o=gl.createShader(ty);gl.shaderSource(o,s);gl.compileShader(o);return o};
 const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);
 if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){cv.remove();return}
 gl.useProgram(pr);gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
 const al=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
 const U=n=>gl.getUniformLocation(pr,n),ur=U('r'),ut=U('t'),ud=U('d'),up=U('p'),um=U('m');
 const dm=matchMedia('(prefers-color-scheme: dark)'),rm=matchMedia('(prefers-reduced-motion: reduce)');
 let mx=.5,my=.5,sx=.5,sy=.5;
 function size(){cv.width=Math.max(2,innerWidth*.5|0);cv.height=Math.max(2,innerHeight*.5|0);gl.viewport(0,0,cv.width,cv.height)}
 addEventListener('resize',size);size();
 addEventListener('pointermove',e=>{mx=e.clientX/innerWidth;my=1-e.clientY/innerHeight});
 function loop(ms){sx+=(mx-sx)*.05;sy+=(my-sy)*.05;pulse*=.94;
  gl.uniform2f(ur,cv.width,cv.height);gl.uniform1f(ut,ms/1000);gl.uniform1f(ud,dm.matches?1:0);gl.uniform1f(up,pulse);gl.uniform2f(um,sx,sy);
  gl.drawArrays(gl.TRIANGLES,0,3);if(!rm.matches)requestAnimationFrame(loop)}
 requestAnimationFrame(loop);
})();
